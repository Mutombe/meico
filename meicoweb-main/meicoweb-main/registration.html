<body class="login-body">

    <!--Login Wrapper-->
    <div class="container-fluid login-wrapper">
        <div class="login-box">
            <h1 class="text-center mb-5"><i class="fa fa-rocket text-primary"></i> Meico Labs</h1>
            <div class="row">
                <div class="col-md-6 col-sm-6 col-12 login-box-info">
                    <h3 class="mb-4">Sign in</h3>
                    <p class="mb-4">Join now the fastest growing Solana comminty </p>
                    <p class="text-center"><a href="login.html" class="btn btn-light">Login here</a></p>
                </div>
                <div class="col-md-6 col-sm-6 col-12 login-box-form p-4">
                    <h3 class="mb-2">Sign up</h3>
                    <small class="text-muted bc-description">Create new account</small>
                    <form method="POST" action="https://www.meicolabs.com/app/registration.php" class="mt-2">


                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1"><i class="fa fa-user"></i></span>
                            </div>
                            <input type="text" name="user_name" class="form-control mt-0" placeholder="Username"
                                aria-label="Username" aria-describedby="basic-addon1">
                        </div>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1"><i class="fa fa-envelope"></i></span>
                            </div>
                            <input type="email" name="email" class="form-control mt-0" placeholder="johndoe@gmail.com"
                                aria-label="email" aria-describedby="basic-addon1">
                        </div>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1"><i class="fa fa-user"></i></span>
                            </div>
                            <input type="text" name="full_name" class="form-control mt-0" placeholder="Full Name"
                                aria-label="phone" aria-describedby="basic-addon1">
                        </div>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1"><i class="fa fa-lock"></i></span>
                            </div>
                            <input type="text" name="Pass_gen" id="Pass-gen" class="form-control mt-0"
                                placeholder="Generate referral code" aria-label="phone" aria-describedby="basic-addon1">
                            <span class="far fa-copy" style="display: none;" onclick="copy()"></span>
                            <span class="fas fa-copy" style="display: none;" onclick="copy()"></span>
                            <button class="btn btn-theme p-2 mb-1" id="btn-gen" type="button">Generate</button>
                        </div>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1"><i class="fa fa-user"></i></span>
                            </div>
                            <input type="text" name="refcode" class="form-control mt-0" placeholder="Referral Code"
                                aria-label="phone" aria-describedby="basic-addon1" value="">
                        </div>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1"><i class="fa fa-lock"></i></span>
                            </div>
                            <input type="text" name="password" class="form-control mt-0" placeholder="Password"
                                aria-label="Password" aria-describedby="basic-addon1">
                        </div>

                        <div class="form-group">
                            <button class="btn btn-theme btn-block p-2 mb-1">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!--Login Wrapper-->

    <!-- Page JavaScript Files-->
    <script>
        const display = document.getElementById("Pass-gen");
        const button = document.getElementById("btn-gen");
        const copyBtn = document.querySelector("span.far");
        const copyActive = document.querySelector("span.fas");
        let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
        button.onclick = () => {
            let i, randomPassword = "";
            copyBtn.style.display = "inline";
            copyActive.style.display = "none";
            for (i = 0; i < 10; i++) {
                randomPassword += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            display.value = randomPassword;
        }
        function copy() {
            copyBtn.style.display = "none";
            copyActive.style.display = "inline";
            display.select();
            document.execCommand("copy");
        }
    </script>
